<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>model-viewer Quick Look (USDZ) test</title>

  <style>
    html,body { height:100%; margin:0; }
    .full { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; }
    #panel {
      position: absolute; top: 12px; left: 12px; background:rgba(0,0,0,0.6);
      padding:10px; border-radius:8px; font-family:system-ui; z-index: 9999;
      color:#fff; font-size:14px;
    }
    #log { max-width:320px; max-height:220px; overflow:auto; font-size:12px; margin-top:6px; background:rgba(255,255,255,0.02); padding:6px; border-radius:6px; }
    button { padding:8px 12px; margin-right:6px; }
    model-viewer { width:100%; height:100%; }
  </style>
</head>
<body>

  <!-- model-viewer (CDN module) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <div id="panel">
    <div>
      <button id="btnOpenAR">Start AR (auto mode)</button>
      <button id="btnOpenQuickLook">Force Quick Look (iOS)</button>
      <span id="platform"></span>
    </div>
    <div style="margin-top:8px;">
      <b>Metrics</b>
      <div>Model load time: <span id="loadTime">—</span></div>
      <div>AR start time (click → ar-status=presented/quicklook): <span id="arStartTime">—</span></div>
      <div>Model size (bytes): <span id="modelSize">—</span></div>
    </div>
    <div id="log"></div>
  </div>

  <!-- model-viewer element -->
  <!-- - src: glb (for on-page preview / webxr)
       - ios-src: usdz (for Quick Look on iOS)
       - ar-modes: try webxr first, then scene-viewer (Android), then quick-look (iOS)
  -->
  <model-viewer id="mv"
    src="./Aorin.glb"
    ios-src="./Aorin.usdz"
    alt="Aorin model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    environment-image="neutral"
    style="width:100%; height:100%; display:block;">
  </model-viewer>

<script>
  const mv = document.getElementById('mv');
  const btn = document.getElementById('btnOpenAR');
  const btnQuick = document.getElementById('btnOpenQuickLook');
  const logEl = document.getElementById('log');
  const loadTimeEl = document.getElementById('loadTime');
  const arStartEl = document.getElementById('arStartTime');
  const sizeEl = document.getElementById('modelSize');
  const platformEl = document.getElementById('platform');

  function log(msg){
    const line = document.createElement('div');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.prepend(line);
  }

  // detect platform
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  platformEl.textContent = isIOS ? 'iOS detected' : 'non-iOS';
  log('platform: ' + platformEl.textContent);

  // measure model load time
  let t0 = performance.now();
  mv.addEventListener('load', () => {
    const t = Math.round(performance.now() - t0);
    loadTimeEl.textContent = `${t} ms`;
    log(`model-viewer load event fired (${t} ms)`);
  });

  // fetch model HEAD to get size (works if same origin / CORS allows)
  async function fetchModelSize(url){
    try {
      const r = await fetch(url, { method: 'HEAD' });
      if (r.ok){
        const cl = r.headers.get('content-length');
        if (cl) {
          sizeEl.textContent = cl;
          log(`content-length: ${cl} bytes`);
          return;
        }
      }
      // fallback: fetch and measure
      const r2 = await fetch(url);
      const blob = await r2.blob();
      sizeEl.textContent = blob.size;
      log(`fetched model (fallback) size: ${blob.size}`);
    } catch (e){
      log('Could not fetch model size: ' + e);
    }
  }
  fetchModelSize('./Aorin.glb');

  // measure AR start: from click to 'ar-status' with status 'session-started' OR quick-look button tap
  let clickTs = 0;
  btn.addEventListener('click', async () => {
    clickTs = performance.now();
    log('Start AR clicked (auto mode)');
    // model-viewer will choose the best AR mode
    // programmatically ask model-viewer to activate AR:
    try {
      await mv.activateAR(); // returns a promise when activation attempt begins
      log('model-viewer.activateAR() called');
    } catch (e) {
      log('activateAR() error: ' + e);
    }
  });

  // button to force Quick Look via model-viewer API (useful for testing on iOS)
  btnQuick.addEventListener('click', async () => {
    clickTs = performance.now();
    log('Force Quick Look click');
    // model-viewer doesn't expose a direct 'open quick look' api, but this attribute influences selection:
    // we set ar-modes so Quick Look will be an option, then call activateAR()
    try {
      await mv.activateAR();
      log('activateAR() called (quicklook request)');
    } catch(e){
      log('activateAR() error: ' + e);
    }
  });

  // Listen to ar-status and quick-look-button-tapped events
  mv.addEventListener('ar-status', (ev) => {
    const s = ev.detail && ev.detail.status ? ev.detail.status : 'unknown';
    const now = Math.round(performance.now() - clickTs);
    log('ar-status: ' + s + ' (since click: ' + now + ' ms)');
    if (clickTs) arStartEl.textContent = now + ' ms';
  });

  mv.addEventListener('quick-look-button-tapped', (ev) => {
    const now = Math.round(performance.now() - clickTs);
    log('quick-look-button-tapped (since click: ' + now + ' ms)');
    if (clickTs) arStartEl.textContent = now + ' ms';
  });

  // ar-tracking indicates ARKit/WebXR tracking status (tracking / not-tracking)
  mv.addEventListener('ar-tracking', (ev) => {
    const s = ev.detail && ev.detail.tracking ? ev.detail.tracking : 'unknown';
    log('ar-tracking: ' + s);
  });

  // some environments emit 'scene-graph-ready' when the on-page GL scene is ready
  mv.addEventListener('scene-graph-ready', () => log('scene-graph-ready'));

  // errors
  mv.addEventListener('error', (ev) => {
    log('model-viewer error: ' + JSON.stringify(ev.detail || ev));
  });

  // helpful hint: if the model has no ar button on iOS, try adding ios-src and ensure usdz is reachable.
</script>

</body>
</html>
