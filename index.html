<!DOCTYPE html>
<html lang="ja">
<head>
  <title>WebAR Demo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    /* ボタンとメッセージのスタイル */
    #info-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      background: #fff;
      color: #000;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #unsupported-message {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 8px;
      text-align: center;
      display: none; /* 初期状態では非表示 */
    }
  </style>
</head>
<body>
  
  <div id="unsupported-message">
    <p>このブラウザはWebARに対応していません。</p>
    <p><b>iOSの場合:</b> Safariを使い、「設定」→「Safari」→「詳細」→「Feature Flags」から「WebXR」関連の項目をオンにしてください。</p>
  </div>
  
  <script type="module">
    // --- ライブラリのインポート ---
    import * as THREE from 'https://unpkg.com/three@0.168.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.168.0/examples/jsm/loaders/GLTFLoader.js';
    // ▼▼▼ この行を修正 ▼▼▼
    import { VRM } from "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.js";

    // --- グローバル変数 ---
    let scene, camera, renderer, controller, reticle, hitTestSource;
    let vrmModel = null; // 読み込んだVRMモデルを保持
    const clock = new THREE.Clock();

    // --- 初期化処理 ---
    function init() {
      // Three.jsの基本設定
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);

      // ライトの設定（より自然な見た目のために環境光と指向性光を追加）
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));
      const light = new THREE.DirectionalLight(0xffffff, 2.5);
      light.position.set(1, 1, 1).normalize();
      scene.add(light);

      // レンダラーの設定
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 画面サイズの変更に対応
      window.addEventListener('resize', onWindowResize);
      
      // AR対応チェックとUIのセットアップ
      setupAR();
    }
    
    // --- AR機能のセットアップ ---
    async function setupAR() {
      const isArSupported = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar');

      if (isArSupported) {
        // AR開始ボタンを作成
        const arButton = document.createElement('button');
        arButton.id = 'info-button';
        arButton.innerText = 'ARを開始';
        arButton.addEventListener('click', startAR);
        document.body.appendChild(arButton);
        
        // コントローラー（画面タップ）の設定
        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        // ヒットテスト用のレティクル（マーカー）を作成
        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial()
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);
        
      } else {
        // 非対応の場合、メッセージを表示
        document.getElementById('unsupported-message').style.display = 'block';
      }
    }

    // --- ARセッションの開始 ---
    async function startAR() {
      this.style.display = 'none'; // ボタンを非表示に

      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test']
        });
        renderer.xr.setSession(session);
        
        // ヒットテストのソースをリクエスト
        const referenceSpace = renderer.xr.getReferenceSpace();
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        
        // セッション終了時の処理
        session.addEventListener('end', () => {
          hitTestSource = null;
          document.getElementById('info-button').style.display = 'block';
        });
        
        // レンダリングループを開始
        renderer.setAnimationLoop(render);

      } catch (e) {
        console.error("ARセッションの開始に失敗しました。", e);
        alert("ARセッションの開始に失敗しました。カメラの許可を確認してください。");
        this.style.display = 'block'; // エラー時にボタンを再表示
      }
    }

    // --- 毎フレームのレンダリング処理 ---
    function render(timestamp, frame) {
      if (!frame) return;
      
      const referenceSpace = renderer.xr.getReferenceSpace();
      
      // ヒットテスト処理（モデルがまだ配置されていない場合のみ）
      if (hitTestSource && !vrmModel) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }

      // VRMモデルのアニメーション更新
      if (vrmModel) {
        vrmModel.update(clock.getDelta());
      }
      
      renderer.render(scene, camera);
    }
    
    // --- 画面がタップされた時の処理 ---
    async function onSelect() {
      if (reticle.visible) {
        try {
          // モデルを読み込み
          const loader = new GLTFLoader();
          const gltf = await loader.loadAsync('./Aorin.vrm'); // VRMモデルのパス
          const newVrm = await VRM.from(gltf);

          // レティクルの位置にモデルを配置
          newVrm.scene.position.setFromMatrixPosition(reticle.matrix);

          // ユーザーの方向を向くように回転
          const cameraPosition = new THREE.Vector3();
          camera.getWorldPosition(cameraPosition);
          newVrm.scene.lookAt(cameraPosition.x, newVrm.scene.position.y, cameraPosition.z);
          
          // モデルのサイズを調整
          newVrm.scene.scale.set(0.6, 0.6, 0.6);
          
          scene.add(newVrm.scene);
          vrmModel = newVrm; // モデルをグローバル変数に保持
          
          // レティクルを非表示にし、ヒットテストを終了
          reticle.visible = false;
          hitTestSource.cancel();
          hitTestSource = null;

        } catch (error) {
          console.error('VRMモデルの読み込みに失敗しました:', error);
          alert('VRMモデルの読み込みに失敗しました。');
        }
      }
    }

    // --- ウィンドウリサイズ処理 ---
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- 実行開始 ---
    init();

  </script>
</body>
</html>
