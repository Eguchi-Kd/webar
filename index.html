<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WebAR auto-detect VRM support (gesture fix)</title>
  <style>
    html,body { height:100%; margin:0; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background:#000; color:#fff; }
    #panel {
      position: absolute; top:12px; left:12px; z-index:9999;
      background: rgba(0,0,0,0.6); color:#fff; padding:12px; border-radius:8px; max-width:360px;
    }
    #log { max-height:220px; overflow:auto; font-size:12px; margin-top:8px; background:rgba(255,255,255,0.02); padding:6px; border-radius:6px; }
    button { padding:8px 10px; margin-right:6px; margin-top:6px; }
    #overlay { position:absolute; inset:0; pointer-events:none; z-index:10000; }
    .hidden-by-enh { display:none !important; }
  </style>
</head>
<body>
  <div id="panel">
    <div>
      <button id="btnAuto">Auto Start (detect device)</button>
      <button id="btnForceWebXR">Force WebXR (Android)</button>
      <button id="btnForceQuickLook">Force Quick Look (iOS)</button>
    </div>
    <div style="margin-top:8px;">Platform: <span id="plat">—</span></div>
    <div style="margin-top:8px;">
      <b>Status</b>
      <div id="status">idle</div>
      <div id="errors" style="color:#f88; margin-top:6px;"></div>
    </div>
    <div id="log"></div>
  </div>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.0"></script>

  <div id="overlay"></div>

  <model-viewer id="mv" style="width:100%; height:100%; display:none;"
    alt="Aorin model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    environment-image="neutral">
  </model-viewer>

<script>
(async function(){
  // ---- (omitted: same helper functions as before: log, setStatus, setError, platform detect, asset resolution)
  const logEl = document.getElementById('log');
  function log(msg){ const d=document.createElement('div'); d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`; logEl.prepend(d); }
  const statusEl = document.getElementById('status'), errEl = document.getElementById('errors'), platEl = document.getElementById('plat');
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  platEl.textContent = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Other');

  function resolveAssetUrl(filename){ const base = location.pathname.replace(/\/[^\/]*$/, '/'); return location.origin + base + filename; }
  const VRM_NAME='Aorin.vrm', GLB_NAME='Aorin.glb', USDZ_NAME='Aorin.usdz';
  const vrmUrl = resolveAssetUrl(VRM_NAME), glbUrl = resolveAssetUrl(GLB_NAME), usdzUrl = resolveAssetUrl(USDZ_NAME);
  log('Resolved VRM: '+vrmUrl); log('Resolved GLB: '+glbUrl); log('Resolved USDZ: '+usdzUrl);

  async function existsHead(url){
    try{ const r = await fetch(url, { method:'HEAD' }); if(r.ok) return true; if(r.status===405||r.status===403){ const r2 = await fetch(url,{ method:'GET', headers:{ Range:'bytes=0-0' } }); return r2.ok; } return false; } catch(e){ return false; }
  }

  async function mainSetup(){
    setStatus('checking assets...');
    const vrmExists = await existsHead(vrmUrl);
    const glbExists = await existsHead(glbUrl);
    const usdzExists = await existsHead(usdzUrl);
    if (!vrmExists && !glbExists && !usdzExists) { setError(`No model found. Upload ${VRM_NAME} or ${GLB_NAME} or ${USDZ_NAME}`); setStatus('error'); return; }
    log('asset check results: vrm='+vrmExists+', glb='+glbExists+', usdz='+usdzExists);

    const mv = document.getElementById('mv');
    if (glbExists) { mv.setAttribute('src', glbUrl); log('model-viewer src set to glb'); } 
    if (usdzExists) { mv.setAttribute('ios-src', usdzUrl); log('model-viewer ios-src set to usdz'); }

    // Three.js setup (same as before)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
    camera.position.set(0,1.6,2.5);
    const light = new THREE.DirectionalLight(0xffffff); light.position.set(1,1,1).normalize(); scene.add(light);
    const amb = new THREE.AmbientLight(0x666666); scene.add(amb);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.domElement.style.touchAction='none'; renderer.domElement.style.userSelect='none';
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    document.body.appendChild(renderer.domElement);

    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', onSelect);
    scene.add(controller);

    const reticle = new THREE.Mesh(new THREE.RingGeometry(0.15,0.2,32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color:0x00ff00 }));
    reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);
    let hitTestSource = null;
    const loader = new THREE.GLTFLoader();

    let previewModel=null, previewIsVRM=false, placedModel=null;

    async function loadPreviewIfNeeded(){
      if (glbExists) { log('glb exists: using model-viewer for preview.'); return; }
      if (!vrmExists) return;
      setStatus('loading VRM for page preview...');
      try{
        const gltf = await loader.loadAsync(vrmUrl);
        if (THREE.VRMUtils) THREE.VRMUtils.removeUnnecessaryJoints(gltf.scene);
        const vrm = await THREE.VRM.from(gltf).catch(()=>null);
        const obj = vrm ? vrm.scene : gltf.scene;
        // default: 50% size, front-facing, no auto-rotation
        obj.scale.setScalar(0.5);
        obj.position.set(0,0,0);
        obj.rotation.set(0,0,0);
        scene.add(obj);
        previewModel = obj; previewIsVRM = !!vrm;
        setStatus('preview loaded');
        // render loop for preview
        (function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();
        // allow gestures to operate on preview initially
        placedModel = previewModel;
      } catch(e){ setError('Failed to load preview VRM: '+e); }
    }

    let enh = null;
    // init enhancements and keep reference
    try {
      const enhModule = await import('./js/webar-enhancements.js');
      enh = await enhModule.initEnhancements({
        renderer,
        camera,
        getPlacedObject: () => (placedModel), // we update placedModel as preview or AR-placed
        modelViewerEl: mv,
        uiRoot: document.body,
        overlayRoot: document.getElementById('overlay'),
        coreUiElements: {
          panel: document.getElementById('panel'),
          log: document.getElementById('log'),
          autoButtons: [document.getElementById('btnAuto'), document.getElementById('btnForceWebXR'), document.getElementById('btnForceQuickLook')]
        }
      });
      log('webar-enhancements initialized');
    } catch(e){ console.warn('enh init failed', e); log('enh init failed: '+e); }

    async function arButtonClick_WebXR(){
      setStatus('requesting WebXR session...');
      try{
        const overlayRoot = document.getElementById('overlay');
        const options = { requiredFeatures:['hit-test'], optionalFeatures:['dom-overlay'], domOverlay:{ root: overlayRoot } };
        const xrSession = await navigator.xr.requestSession('immersive-ar', options);

        // BEFORE setSession: hide preview to require tap placement
        if (previewModel) previewModel.visible = false;

        await renderer.xr.setSession(xrSession);

        // inform enhancements about XR session (important!)
        if (enh && typeof enh.setXRSession === 'function') enh.setXRSession(xrSession);

        setStatus('WebXR session started');
        // restore preview on end
        xrSession.addEventListener('end', () => {
          if (enh && typeof enh.setXRSession === 'function') enh.setXRSession(null);
          if (previewModel) { previewModel.visible = true; placedModel = previewModel; }
          hitTestSource = null;
          renderer.setAnimationLoop(null);
          // restart small preview render loop
          (function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();
          setStatus('WebXR session ended');
        });

        renderer.setAnimationLoop(render);
      } catch(e){
        setError('Failed to start WebXR session: '+e);
        setStatus('WebXR start failed');
      }
    }

    function render(time, frame){
      if (!frame) return;
      const session = renderer.xr.getSession();
      const refSpace = renderer.xr.getReferenceSpace();
      if (!hitTestSource && refSpace && session){
        session.requestReferenceSpace('viewer').then((space) => {
          session.requestHitTestSource({ space }).then((source) => {
            hitTestSource = source;
            session.addEventListener('end', () => { hitTestSource = null; });
          });
        }).catch(()=>{});
      }
      if (hitTestSource){
        const hits = frame.getHitTestResults(hitTestSource);
        if (hits.length && refSpace){
          const hit = hits[0];
          reticle.visible = true;
          reticle.matrix.fromArray(hit.getPose(refSpace).transform.matrix);
        } else { reticle.visible = false; }
      }
      renderer.render(scene,camera);
    }

    async function onSelect(){
      if (!reticle.visible) { log('select but reticle not visible'); return; }
      setStatus('placing model from ' + (vrmExists ? VRM_NAME : GLB_NAME));
      try {
        const modelUrlToLoad = vrmExists ? vrmUrl : (glbExists ? glbUrl : null);
        if (!modelUrlToLoad) { setError('No model available to place in AR'); return; }

        // if placedModel exists, move it
        if (placedModel && placedModel!==previewModel) {
          const newPos=new THREE.Vector3(), newQuat=new THREE.Quaternion(), newScale=new THREE.Vector3();
          reticle.matrix.decompose(newPos,newQuat,newScale);
          placedModel.position.copy(newPos);
          placedModel.quaternion.copy(newQuat);
          if (!placedModel.scale || placedModel.scale.length()===0) placedModel.scale.setScalar(0.05);
          setStatus('Moved existing model to new position');
          reticle.visible=false;
          return;
        }

        // otherwise load and place new model
        const gltf = await loader.loadAsync(modelUrlToLoad);
        if (THREE.VRMUtils) THREE.VRMUtils.removeUnnecessaryJoints(gltf.scene);
        const maybeVrm = await THREE.VRM.from(gltf).catch(()=>null);
        const obj = maybeVrm ? maybeVrm.scene : gltf.scene;
        reticle.matrix.decompose(obj.position, obj.quaternion, obj.scale);
        obj.rotation.y = camera.rotation.y + Math.PI;
        if (maybeVrm) maybeVrm.lookAt.target = camera;
        obj.scale.multiplyScalar(0.05); // 50% smaller relative to previous baseline
        scene.add(obj);
        placedModel = obj;
        reticle.visible=false;
        log('model placed into AR scene');
      } catch(e){ setError('Model load/place failed: '+e); }
    }

    // wire UI buttons
    document.getElementById('btnAuto').addEventListener('click', async ()=>{
      setStatus('auto-start clicked'); setError('');
      if (isIOS && usdzExists){ mv.style.display='block'; try{ await mv.activateAR(); setStatus('model-viewer activateAR called'); } catch(e){ setError('activateAR error:'+e);} return; }
      if (isAndroid && navigator.xr && navigator.xr.isSessionSupported){
        try {
          const sup = await navigator.xr.isSessionSupported('immersive-ar');
          if (sup) { await arButtonClick_WebXR(); return; }
        } catch(e) { console.warn(e); }
      }
      if (glbExists) { mv.style.display='block'; try{ await mv.activateAR(); } catch(e){ setError('activateAR error:'+e); } }
      else if (vrmExists) { await loadPreviewIfNeeded(); } else setError('No suitable model found');
    });

    document.getElementById('btnForceWebXR').addEventListener('click', async ()=>{
      setError(''); if (!navigator.xr || !navigator.xr.isSessionSupported) { setError('navigator.xr or isSessionSupported not available'); return; }
      const sup = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
      if (!sup) { setError('WebXR immersive-ar not supported'); return; }
      await arButtonClick_WebXR();
    });
    document.getElementById('btnForceQuickLook').addEventListener('click', async ()=>{
      setError(''); if (!usdzExists) { setError('No USDZ available'); return; } mv.style.display='block'; try{ await mv.activateAR(); } catch(e){ setError('activateAR error:'+e); }
    });

    // prepare preview if needed
    if (!glbExists && vrmExists) await loadPreviewIfNeeded();

    // resize handling
    window.addEventListener('resize', ()=>{ camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    setStatus('ready'); log('Ready. Press Auto Start.');
    // expose some internals for debugging if needed
    window.__webar_debug = { renderer, scene, camera, getPlaced: ()=>placedModel, previewModel };
  } // end mainSetup

  function setStatus(s){ document.getElementById('status').textContent = s; log('status -> '+s); }
  function setError(e){ document.getElementById('errors').textContent = e; log('ERROR: '+e); }

  await mainSetup();
})();
</script>
</body>
</html>
